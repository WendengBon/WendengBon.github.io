<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文燈 · 線上編輯器</title>
    <style>
        /* ===== 全域重置 & 文燈風格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Georgia", "Times New Roman", serif;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e8ff;
            background: #0a0e1a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.5s ease;
            position: relative;
        }

        /* 背景光暈 (仿官方首頁) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: opacity 1.5s ease;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, rgba(180, 215, 240, 0.30) 0%, rgba(210, 230, 248, 0.15) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 主容器 ===== */
        .main-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(15, 25, 50, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px 32px 28px 28px;
            padding: 36px 40px 32px;
            position: relative;
            border: 2px solid #f5efe8;
            box-shadow:
                0 12px 48px rgba(0, 0, 30, 0.5),
                0 0 0 2px rgba(245, 239, 232, 0.10) inset,
                0 0 0 4px rgba(245, 239, 232, 0.04) inset;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        /* 頂部裝飾 ❧ */
        .main-container::before {
            content: "❧";
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: rgba(245, 239, 232, 0.30);
            background: rgba(15, 25, 50, 0.55);
            backdrop-filter: blur(8px);
            padding: 0 14px;
        }

        /* ===== 標頭 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(245, 239, 232, 0.12);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .brand h1 {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #f5efe8;
            text-shadow: 0 0 12px rgba(180, 215, 240, 0.15);
        }

        .brand .sub {
            font-size: 14px;
            color: rgba(245, 239, 232, 0.50);
            letter-spacing: 2px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(245, 239, 232, 0.06);
            border: 1px solid rgba(245, 239, 232, 0.12);
            color: #e0e8ff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s;
        }

        .toolbar label:hover {
            background: rgba(245, 239, 232, 0.14);
            border-color: rgba(245, 239, 232, 0.30);
        }

        .toolbar label input[type="file"] {
            display: none;
        }

        .toolbar .btn {
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(245, 239, 232, 0.20);
            background: rgba(245, 239, 232, 0.06);
            color: #e0e8ff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, transform 0.15s;
            backdrop-filter: blur(4px);
        }

        .toolbar .btn:hover {
            background: rgba(245, 239, 232, 0.16);
            border-color: rgba(245, 239, 232, 0.40);
        }

        .toolbar .btn:active {
            transform: scale(0.96);
        }

        .toolbar .btn-primary {
            background: rgba(180, 215, 240, 0.12);
            border-color: rgba(180, 215, 240, 0.30);
        }

        .toolbar .btn-primary:hover {
            background: rgba(180, 215, 240, 0.22);
            border-color: rgba(180, 215, 240, 0.50);
        }

        /* ===== 檔案資訊列 ===== */
        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 14px;
            font-size: 13px;
            color: rgba(245, 239, 232, 0.55);
            padding: 0 4px;
        }

        .file-info .name {
            color: #e0e8ff;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .file-info .status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            opacity: 0.6;
        }

        /* ===== 編輯器主體 ===== */
        .editor-wrap {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(245, 239, 232, 0.10);
            background: rgba(0, 0, 0, 0.30);
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.30);
        }

        #editor {
            width: 100%;
            min-height: 480px;
            max-height: 70vh;
            padding: 24px 28px;
            font-family: "JetBrains Mono", "Fira Code", "Menlo", "Consolas", monospace;
            font-size: 15px;
            line-height: 1.75;
            color: #e8edf5;
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            caret-color: #b8d4f0;
        }

        #editor::selection {
            background: rgba(180, 215, 240, 0.20);
        }

        #editor::placeholder {
            color: rgba(245, 239, 232, 0.25);
            font-family: "Noto Serif SC", "Georgia", serif;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            font-size: 13px;
            color: rgba(245, 239, 232, 0.30);
            letter-spacing: 1px;
            border-top: 1px solid rgba(245, 239, 232, 0.06);
            padding-top: 18px;
        }

        .footer .hint {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer .hint span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer .hint kbd {
            display: inline-block;
            padding: 0 8px;
            border-radius: 4px;
            background: rgba(245, 239, 232, 0.06);
            border: 1px solid rgba(245, 239, 232, 0.08);
            font-size: 12px;
            font-family: inherit;
            color: rgba(245, 239, 232, 0.50);
        }

        .footer .credit a {
            color: rgba(245, 239, 232, 0.35);
            text-decoration: none;
            transition: color 0.25s;
        }

        .footer .credit a:hover {
            color: rgba(245, 239, 232, 0.70);
        }

        /* ===== RWD 響應式 ===== */
        @media (max-width: 640px) {
            .main-container {
                padding: 24px 18px 20px;
            }
            .brand h1 {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .brand .sub {
                font-size: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .toolbar {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            #editor {
                min-height: 320px;
                padding: 16px 18px;
                font-size: 14px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 16px 10px;
            }
            .main-container {
                padding: 18px 12px 16px;
                border-radius: 24px;
            }
            .main-container::before {
                font-size: 20px;
                top: -10px;
            }
            #editor {
                min-height: 240px;
                padding: 12px 14px;
                font-size: 13px;
            }
            .toolbar .btn,
            .toolbar label {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- ===== 標頭 ===== -->
        <header class="header">
            <div class="brand">
                <h1>文燈 · 線上編輯器</h1>
                <span class="sub">✧ 開源 · 本機優先</span>
            </div>
            <div class="toolbar">
                <label for="fileInput">
                    📂 開啟檔案
                    <input type="file" id="fileInput" accept=".html,.htm,.txt,.css,.js,.json,.xml,.svg,.md,.py,.c,.cpp,.java,.go,.rs,.sh" />
                </label>
                <button class="btn btn-primary" id="saveBtn">💾 儲存至本機</button>
                <button class="btn" id="resetBtn">⟳ 新增</button>
            </div>
        </header>

        <!-- ===== 檔案資訊 ===== -->
        <div class="file-info">
            <span class="name" id="fileName">📄 未命名</span>
            <span class="status">
                <span class="dot" id="statusDot"></span>
                <span id="fileSize">就緒</span>
            </span>
        </div>

        <!-- ===== 編輯器 ===== -->
        <div class="editor-wrap">
            <textarea id="editor" placeholder="在此貼上或開啟檔案開始編輯 …&#10;支援 HTML、純文字、多種程式碼格式。"></textarea>
        </div>

        <!-- ===== 底部 ===== -->
        <footer class="footer">
            <div class="hint">
                <span>⌨️ <kbd>Ctrl+S</kbd> 儲存</span>
                <span>📂 將檔案拖曳至編輯器亦可開啟</span>
            </div>
            <div class="credit">
                <a href="https://wendengbon.github.io/" target="_blank">文燈 · 官方</a>
                &nbsp;·&nbsp; 一盞油燈 · 一方書齋
            </div>
        </footer>

    </div>

    <script>
        (function() {
            "use strict";

            const editor = document.getElementById('editor');
            const fileInput = document.getElementById('fileInput');
            const saveBtn = document.getElementById('saveBtn');
            const resetBtn = document.getElementById('resetBtn');
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const statusDot = document.getElementById('statusDot');

            // ----- 狀態 -----
            let currentFileName = '未命名';
            let currentFileContent = '';
            let fileHandle = null;

            // ----- 更新狀態顯示 -----
            function updateStatus(text, isReady) {
                fileSizeEl.textContent = text;
                statusDot.style.background = isReady ? '#4caf50' : '#ffb74d';
                statusDot.style.opacity = isReady ? '0.6' : '1';
            }

            function updateFileName(name) {
                currentFileName = name || '未命名';
                fileNameEl.textContent = '📄 ' + currentFileName;
            }

            // ----- 讀取檔案 (透過 File 物件) -----
            function readFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    editor.value = content;
                    currentFileContent = content;
                    updateFileName(file.name);
                    updateStatus((file.size / 1024).toFixed(1) + ' KB', true);
                };
                reader.onerror = function() {
                    updateStatus('讀取失敗', false);
                };
                reader.readAsText(file, 'UTF-8');
            }

            // ----- 開啟檔案 (透過 input) -----
            function openFileViaInput(file) {
                if (!file) return;
                readFile(file);
            }

            // ----- 儲存檔案 -----
            function saveFile() {
                const content = editor.value;
                if (!content.trim() && !currentFileName) {
                    // 允許儲存空白檔案
                }

                if ('showSaveFilePicker' in window) {
                    const opts = {
                        suggestedName: currentFileName || '未命名.txt',
                        types: [{
                            description: '文字檔案',
                            accept: { 'text/plain': ['.txt', '.html', '.htm', '.css', '.js', '.json', '.xml',
                                    '.svg', '.md', '.py', '.c', '.cpp', '.java', '.go', '.rs', '.sh'
                                ] },
                        }, ],
                    };
                    window.showSaveFilePicker(opts)
                        .then(handle => {
                            fileHandle = handle;
                            return handle.createWritable();
                        })
                        .then(writable => {
                            return writable.write(content);
                        })
                        .then(() => {
                            updateStatus('已儲存 ✓', true);
                        })
                        .catch(err => {
                            if (err.name === 'AbortError') return;
                            fallbackSave(content);
                        });
                } else {
                    fallbackSave(content);
                }
            }

            // ----- 傳統下載方式 (相容所有瀏覽器) -----
            function fallbackSave(content) {
                let ext = '';
                if (currentFileName && currentFileName.includes('.')) {
                    ext = currentFileName.substring(currentFileName.lastIndexOf('.'));
                } else {
                    const trimmed = content.trim();
                    if (trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html') || trimmed.startsWith('<?xml')) {
                        ext = '.html';
                    } else if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                        ext = '.json';
                    } else {
                        ext = '.txt';
                    }
                }
                const name = currentFileName && currentFileName !== '未命名' ?
                    currentFileName :
                    '未命名' + ext;

                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                updateStatus('已下載 ✓', true);
            }

            // ----- 重置 / 新增 -----
            function resetEditor() {
                if (editor.value && !confirm('目前內容尚未儲存，確定要新增嗎？')) return;
                editor.value = '';
                currentFileContent = '';
                updateFileName('未命名');
                updateStatus('就緒', true);
                fileInput.value = '';
                fileHandle = null;
                editor.focus();
            }

            // ----- 拖曳支援 -----
            function setupDragDrop() {
                const dropTarget = document.querySelector('.editor-wrap');
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                    dropTarget.addEventListener(evt, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    });
                });

                dropTarget.addEventListener('dragover', () => {
                    dropTarget.style.borderColor = 'rgba(180, 215, 240, 0.50)';
                    dropTarget.style.boxShadow = 'inset 0 0 30px rgba(180, 215, 240, 0.08)';
                });

                dropTarget.addEventListener('dragleave', () => {
                    dropTarget.style.borderColor = 'rgba(245, 239, 232, 0.10)';
                    dropTarget.style.boxShadow = 'inset 0 4px 20px rgba(0, 0, 0, 0.30)';
                });

                dropTarget.addEventListener('drop', (e) => {
                    dropTarget.style.borderColor = 'rgba(245, 239, 232, 0.10)';
                    dropTarget.style.boxShadow = 'inset 0 4px 20px rgba(0, 0, 0, 0.30)';
                    const files = e.dataTransfer.files;
                    if (files && files.length > 0) {
                        const file = files[0];
                        const type = file.type;
                        if (type.startsWith('text/') || type === '' || file.name.match(/\.(txt|html?|css|js|json|xml|svg|md|py|c|cpp|java|go|rs|sh|xml|yaml|yml|toml|ini|cfg|conf)$/i)) {
                            readFile(file);
                        } else {
                            updateStatus('不支援的檔案類型', false);
                            setTimeout(() => updateStatus('就緒', true), 1500);
                        }
                    }
                });
            }

            // ----- 鍵盤快捷鍵 -----
            function setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        saveFile();
                    }
                });
            }

            // ----- 監聽檔案輸入變化 -----
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    openFileViaInput(this.files[0]);
                }
                this.value = '';
            });

            // ----- 儲存按鈕 -----
            saveBtn.addEventListener('click', saveFile);

            // ----- 重置按鈕 -----
            resetBtn.addEventListener('click', resetEditor);

            // ----- 初始化 -----
            function init() {
                updateFileName('未命名');
                updateStatus('就緒', true);
                setupDragDrop();
                setupKeyboard();
                editor.focus();

                console.log('🪔 文燈 · 線上編輯器已載入');
                console.log('📂 支援開啟 HTML / 純文字 / 程式碼檔案');
                console.log('💾 Ctrl+S 儲存至本機');
            }

            init();

            window.__editor = {
                editor,
                save: saveFile,
                reset: resetEditor,
                open: readFile,
            };

        })();
    </script>

</body>
</html>
