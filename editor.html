<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文燈 · 線上編輯器</title>
    <style>
        /* ===== 全域重置 & 文燈風格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Georgia", "Times New Roman", serif;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e8ff;
            background: #0a0e1a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.5s ease, background-color 0.5s;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: opacity 1.5s ease;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, rgba(180, 215, 240, 0.30) 0%, rgba(210, 230, 248, 0.15) 100%);
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s;
        }

        body.dark-mode {
            background-color: #050a1a;
        }
        body.dark-mode::after {
            background: radial-gradient(ellipse at 30% 40%, rgba(10, 25, 55, 0.60) 0%, rgba(0, 5, 20, 0.85) 100%);
        }

        /* ===== 主容器 ===== */
        .main-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(15, 25, 50, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px 32px 28px 28px;
            padding: 30px 32px 24px;
            position: relative;
            border: 2px solid #f5efe8;
            box-shadow:
                0 12px 48px rgba(0, 0, 30, 0.5),
                0 0 0 2px rgba(245, 239, 232, 0.10) inset,
                0 0 0 4px rgba(245, 239, 232, 0.04) inset;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }

        body.dark-mode .main-container {
            background: rgba(5, 10, 30, 0.65);
            border-color: #f5efe8;
            box-shadow:
                0 12px 48px rgba(0, 0, 10, 0.6),
                0 0 0 2px rgba(245, 239, 232, 0.08) inset,
                0 0 0 4px rgba(245, 239, 232, 0.03) inset;
        }

        /* 移除裝飾符號 */
        .main-container::before {
            display: none;
        }

        /* ===== 標頭 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(245, 239, 232, 0.12);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .brand h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #f5efe8;
            text-shadow: 0 0 12px rgba(180, 215, 240, 0.15);
        }
        .brand .sub {
            font-size: 13px;
            color: rgba(245, 239, 232, 0.50);
            letter-spacing: 2px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .toolbar .btn {
            padding: 5px 16px;
            border-radius: 30px;
            border: 1px solid rgba(245, 239, 232, 0.20);
            background: rgba(245, 239, 232, 0.06);
            color: #e0e8ff;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, transform 0.15s;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .toolbar .btn:hover {
            background: rgba(245, 239, 232, 0.16);
            border-color: rgba(245, 239, 232, 0.40);
        }
        .toolbar .btn:active {
            transform: scale(0.95);
        }
        .toolbar .btn-primary {
            background: rgba(180, 215, 240, 0.12);
            border-color: rgba(180, 215, 240, 0.30);
        }
        .toolbar .btn-primary:hover {
            background: rgba(180, 215, 240, 0.22);
            border-color: rgba(180, 215, 240, 0.50);
        }
        .toolbar label.btn {
            cursor: pointer;
        }
        .toolbar label.btn input[type="file"] {
            display: none;
        }
        .toolbar .theme-btn {
            font-size: 18px;
            padding: 2px 12px;
        }

        /* ===== 編輯器區域 ===== */
        .editor-wrapper {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.20);
            border-radius: 16px;
            border: 1px solid rgba(245, 239, 232, 0.08);
            overflow: hidden;
            transition: border-color 0.3s;
        }

        /* 標籤欄 */
        .tab-bar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.20);
            padding: 4px 8px 4px 12px;
            gap: 2px;
            flex-wrap: nowrap;
            overflow-x: auto;
            border-bottom: 1px solid rgba(245, 239, 232, 0.06);
            min-height: 36px;
        }
        .tab-bar::-webkit-scrollbar {
            height: 3px;
        }
        .tab-bar::-webkit-scrollbar-track {
            background: transparent;
        }
        .tab-bar::-webkit-scrollbar-thumb {
            background: rgba(245, 239, 232, 0.20);
            border-radius: 10px;
        }

        .tab-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: rgba(245, 239, 232, 0.55);
            background: transparent;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            font-family: inherit;
            position: relative;
            flex-shrink: 0;
        }
        .tab-item:hover {
            background: rgba(245, 239, 232, 0.08);
            color: #e0e8ff;
        }
        .tab-item.active {
            background: rgba(180, 215, 240, 0.12);
            color: #f5efe8;
            box-shadow: 0 0 12px rgba(60, 140, 255, 0.04);
        }
        .tab-item .tab-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(245, 239, 232, 0.30);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            padding: 0;
            line-height: 1;
        }
        .tab-item .tab-close:hover {
            background: rgba(255, 70, 70, 0.25);
            color: #ff8a8a;
        }
        .tab-item.active .tab-close {
            color: rgba(245, 239, 232, 0.50);
        }
        .tab-item .tab-close:active {
            transform: scale(0.85);
        }

        .tab-add-btn {
            background: transparent;
            border: none;
            color: rgba(245, 239, 232, 0.30);
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s, transform 0.2s;
            flex-shrink: 0;
            line-height: 1;
        }
        .tab-add-btn:hover {
            color: #8ab8ff;
            transform: rotate(90deg);
        }

        /* 編輯器文字區（可縮放） */
        .editor-textarea {
            width: 100%;
            min-height: 400px;
            padding: 16px 20px;
            font-family: "JetBrains Mono", "Fira Code", "Menlo", "Consolas", monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #e8edf5;
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            caret-color: #b8d4f0;
        }
        .editor-textarea::selection {
            background: rgba(180, 215, 240, 0.20);
        }
        .editor-textarea::placeholder {
            color: rgba(245, 239, 232, 0.20);
            font-family: "Noto Serif SC", "Georgia", serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* 狀態列 */
        .editor-status {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            font-size: 12px;
            color: rgba(245, 239, 232, 0.25);
            border-top: 1px solid rgba(245, 239, 232, 0.04);
            background: rgba(0, 0, 0, 0.10);
            flex-shrink: 0;
        }
        .editor-status .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            opacity: 0.5;
            margin-right: 4px;
        }
        .editor-status .status-text {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editor-status .status-time {
            font-feature-settings: "tnum";
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(245, 239, 232, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 12px;
            color: rgba(245, 239, 232, 0.25);
        }
        .footer .hint {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .footer .hint kbd {
            display: inline-block;
            padding: 0 6px;
            border-radius: 4px;
            background: rgba(245, 239, 232, 0.06);
            border: 1px solid rgba(245, 239, 232, 0.08);
            font-size: 11px;
            font-family: inherit;
            color: rgba(245, 239, 232, 0.40);
        }
        .footer .credit a {
            color: rgba(245, 239, 232, 0.30);
            text-decoration: none;
            transition: color 0.25s;
        }
        .footer .credit a:hover {
            color: rgba(245, 239, 232, 0.60);
        }

        /* ===== 響應式 ===== */
        @media (max-width: 720px) {
            body {
                padding: 16px 10px;
            }
            .main-container {
                padding: 18px 14px 16px;
                border-radius: 24px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .brand h1 {
                font-size: 20px;
            }
            .toolbar {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .editor-textarea {
                min-height: 250px;
                font-size: 13px;
                padding: 12px 16px;
            }
            .tab-item {
                font-size: 12px;
                padding: 3px 10px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
        @media (max-width: 400px) {
            .main-container {
                padding: 12px 8px;
            }
            .brand h1 {
                font-size: 17px;
            }
            .toolbar .btn {
                font-size: 12px;
                padding: 4px 12px;
            }
            .tab-item {
                font-size: 11px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- ===== 標頭 ===== -->
        <header class="header">
            <div class="brand">
                <h1>文燈 · 線上編輯器</h1>
                <span class="sub">✧ 多標籤 · 本機優先</span>
            </div>
            <div class="toolbar">
                <label class="btn btn-primary">
                    📂 開啟
                    <input type="file" id="globalFileInput" accept=".html,.htm,.txt,.css,.js,.json,.xml,.svg,.md,.py,.c,.cpp,.java,.go,.rs,.sh" multiple />
                </label>
                <button class="btn btn-primary" id="saveBtn">💾 儲存</button>
                <button class="btn" id="resetBtn">⟳ 新增標籤</button>
                <button class="btn theme-btn" id="themeBtn">🌙</button>
            </div>
        </header>

        <!-- ===== 編輯器 ===== -->
        <div class="editor-wrapper">
            <div class="tab-bar" id="tabBar">
                <!-- 動態生成 -->
            </div>
            <textarea class="editor-textarea" id="editor" placeholder="在此編輯 … 可開啟多個檔案 (標籤)"></textarea>
            <div class="editor-status">
                <span class="status-text">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusLabel">就緒</span>
                </span>
                <span class="status-time" id="statusTime">--:--:--</span>
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <footer class="footer">
            <div class="hint">
                <span>⌨️ <kbd>Ctrl+S</kbd> 儲存</span>
                <span><kbd>Ctrl+W</kbd> 關閉標籤</span>
                <span>📂 拖曳檔案至編輯區開啟</span>
            </div>
            <div class="credit">
                <a href="https://wendengbon.github.io/" target="_blank">文燈 · 官方</a>
                &nbsp;·&nbsp; 一盞油燈 · 一方書齋
            </div>
        </footer>

    </div>

    <script>
        (function() {
            "use strict";

            // ============================================================
            // 1. 深淺模式
            // ============================================================
            const State = {
                darkMode: localStorage.getItem('wdTheme') === 'dark'
            };

            function applyTheme() {
                document.body.classList.toggle('dark-mode', State.darkMode);
                const icon = State.darkMode ? '☀️' : '🌙';
                document.getElementById('themeBtn').textContent = icon;
                localStorage.setItem('wdTheme', State.darkMode ? 'dark' : 'light');
            }

            function toggleTheme() {
                State.darkMode = !State.darkMode;
                applyTheme();
            }
            document.getElementById('themeBtn').addEventListener('click', toggleTheme);
            applyTheme();

            // ============================================================
            // 2. 每日壁紙
            // ============================================================
            function getDailyWallpaper() {
                const now = new Date();
                const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
                const images = [
                    'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80',
                    'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80',
                    'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80',
                    'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80',
                    'https://images.unsplash.com/photo-1518173946687-a36f968f7f6a?w=1920&q=80',
                    'https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=1920&q=80',
                    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80'
                ];
                return images[seed % images.length];
            }

            function setWallpaper() {
                document.body.style.backgroundImage = 'url("' + getDailyWallpaper() + '")';
            }
            setWallpaper();
            const now = new Date();
            const msToMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0) - now;
            setTimeout(() => { setWallpaper(); }, msToMidnight + 1000);

            // ============================================================
            // 3. 時鐘
            // ============================================================
            function updateClock() {
                const now = new Date();
                const t = now.toTimeString().slice(0, 8);
                document.getElementById('statusTime').textContent = t;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ============================================================
            // 4. 標籤管理
            // ============================================================
            const tabBar = document.getElementById('tabBar');
            const editor = document.getElementById('editor');
            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');

            let tabs = [];
            let currentIndex = 0;

            function renderTabs() {
                while (tabBar.firstChild) tabBar.removeChild(tabBar.firstChild);

                tabs.forEach((tab, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-item' + (idx === currentIndex ? ' active' : '');
                    btn.dataset.index = idx;
                    btn.innerHTML = `
                        <span class="tab-name">${escapeHtml(tab.name)}</span>
                        <span class="tab-close" data-index="${idx}">✕</span>
                    `;
                    btn.addEventListener('click', function(e) {
                        if (e.target.classList.contains('tab-close')) return;
                        const index = parseInt(this.dataset.index);
                        switchTab(index);
                    });
                    const closeBtn = btn.querySelector('.tab-close');
                    closeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const index = parseInt(this.dataset.index);
                        closeTab(index);
                    });
                    tabBar.appendChild(btn);
                });

                // 新增按鈕
                const addBtn = document.createElement('button');
                addBtn.className = 'tab-add-btn';
                addBtn.textContent = '+';
                addBtn.addEventListener('click', function() {
                    addTab('未命名', '');
                    switchTab(tabs.length - 1);
                });
                tabBar.appendChild(addBtn);
            }

            function switchTab(index) {
                if (index < 0 || index >= tabs.length) return;
                // 保存當前內容
                if (tabs[currentIndex]) {
                    tabs[currentIndex].content = editor.value;
                }
                currentIndex = index;
                editor.value = tabs[currentIndex].content;
                // 更新標籤樣式
                const items = tabBar.querySelectorAll('.tab-item');
                items.forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === index);
                });
                updateStatus('就緒', true);
                editor.focus();
            }

            function addTab(name, content) {
                tabs.push({ name: name || '未命名', content: content || '' });
                renderTabs();
            }

            function closeTab(index) {
                if (tabs.length <= 1) {
                    // 最後一個標籤不關閉，清空內容
                    tabs[0] = { name: '未命名', content: '' };
                    switchTab(0);
                    renderTabs();
                    return;
                }
                tabs.splice(index, 1);
                if (currentIndex >= tabs.length) {
                    currentIndex = tabs.length - 1;
                } else if (currentIndex === index) {
                    currentIndex = Math.min(index, tabs.length - 1);
                }
                renderTabs();
                switchTab(currentIndex);
            }

            function updateStatus(text, ready) {
                statusLabel.textContent = text;
                statusDot.style.background = ready ? '#4caf50' : '#ffb74d';
                statusDot.style.opacity = ready ? '0.6' : '1';
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // 監聽編輯器輸入
            editor.addEventListener('input', function() {
                if (tabs[currentIndex]) {
                    tabs[currentIndex].content = editor.value;
                }
                updateStatus('已修改', false);
            });

            // ============================================================
            // 5. 拖曳開啟檔案
            // ============================================================
            const dropTarget = document.querySelector('.editor-wrapper');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                dropTarget.addEventListener(evt, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            });
            dropTarget.addEventListener('dragover', () => {
                dropTarget.style.borderColor = 'rgba(180, 215, 240, 0.50)';
            });
            dropTarget.addEventListener('dragleave', () => {
                dropTarget.style.borderColor = 'rgba(245, 239, 232, 0.08)';
            });
            dropTarget.addEventListener('drop', (e) => {
                dropTarget.style.borderColor = 'rgba(245, 239, 232, 0.08)';
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    for (let f of files) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const content = ev.target.result;
                            const name = f.name;
                            addTab(name, content);
                            switchTab(tabs.length - 1);
                        };
                        reader.readAsText(f, 'UTF-8');
                    }
                }
            });

            // ============================================================
            // 6. 全局操作
            // ============================================================
            // 開啟檔案 (input)
            document.getElementById('globalFileInput').addEventListener('change', function(e) {
                const files = this.files;
                if (!files || files.length === 0) return;
                for (let f of files) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const content = ev.target.result;
                        const name = f.name;
                        addTab(name, content);
                        switchTab(tabs.length - 1);
                    };
                    reader.readAsText(f, 'UTF-8');
                }
                this.value = '';
            });

            // 儲存
            document.getElementById('saveBtn').addEventListener('click', function() {
                const tab = tabs[currentIndex];
                if (!tab) return;
                tab.content = editor.value;
                const content = tab.content;
                let ext = '';
                const name = tab.name;
                if (name.includes('.')) {
                    ext = name.substring(name.lastIndexOf('.'));
                } else {
                    const trimmed = content.trim();
                    if (trimmed.startsWith('<!DOCTYPE') || trimmed.startsWith('<html') || trimmed.startsWith('<?xml'))
                        ext = '.html';
                    else if (trimmed.startsWith('{') || trimmed.startsWith('[')) ext = '.json';
                    else ext = '.txt';
                }
                const fullName = name || '未命名' + ext;
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fullName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                updateStatus('已儲存 ✓', true);
            });

            // 新增標籤
            document.getElementById('resetBtn').addEventListener('click', function() {
                addTab('未命名', '');
                switchTab(tabs.length - 1);
            });

            // 鍵盤快捷鍵
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    document.getElementById('saveBtn').click();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                    e.preventDefault();
                    closeTab(currentIndex);
                }
            });

            // ============================================================
            // 7. 初始化
            // ============================================================
            const defaultContent = `// 歡迎使用文燈線上編輯器
// 支援多標籤、深淺模式、每日壁紙
// 開啟檔案或拖曳至此

console.log("🪔 文燈 · 線上編輯器");
console.log("📂 多標籤, 深淺模式, 即時時鐘");
`;
            addTab('歡迎.js', defaultContent);
            switchTab(0);

            console.log('🪔 文燈線上編輯器已載入 (多標籤)');
        })();
    </script>

</body>
</html>
